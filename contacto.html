<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulario de contacto de MAPTEL CREATE.">
    <title>MAPTEL CREATE | Contacto</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>MAPTEL CREATE</h1>
    <nav aria-label="Navegación principal">
        <a href="index.html">Inicio</a>
        <a href="servicios.html">Servicios</a>
        <a href="contacto.html">Contacto</a>
    </nav>
</header>

<main>
    <section class="page-intro">
        <h2>Contacto</h2>
        <p>Completá el formulario y nos comunicaremos con vos.</p>
    </section>

    <section class="contact">
        <form class="contact-form" action="#" method="post">
            <div>
                <label for="nombre">Nombre y Apellido</label>
                <input type="text" id="nombre" name="nombre" placeholder="Nombre y Apellido" required>
            </div>

            <div>
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>
            </div>

            <div>
                <label for="telefono">Número de Teléfono</label>
                <input type="tel" id="telefono" name="telefono" placeholder="+54 9..." required>
            </div>

            <div>
                <label for="empresa">Nombre de la Empresa</label>
                <input type="text" id="empresa" name="empresa" placeholder="Nombre de la empresa" required>
            </div>

            <div>
                <label for="mensaje">Consulta</label>
                <textarea id="mensaje" name="mensaje" placeholder="Escribí tu consulta..." required></textarea>
            </div>

            <button class="btn" type="submit">Enviar Consulta</button>
        </form>
    </section>
</main>

<footer>
    <p><strong>MAPTEL CREATE</strong></p>
    <p>Email: contacto@maptelcreate.com</p>
    <p>Teléfono: +54 11 4567-8901</p>
    <p>&copy; 2026 Todos los derechos reservados.</p>
</footer>

</body>
</html>
